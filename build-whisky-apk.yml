name: Build Whisky Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'WhiskyCellularDownloader-source.zip'
      - '.github/workflows/build-whisky-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout DTRe
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f WhiskyCellularDownloader-source.zip
          unzip -t WhiskyCellularDownloader-source.zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .whisky-build-src
          mkdir -p .whisky-build-src
          unzip -q WhiskyCellularDownloader-source.zip -d .whisky-build-src
          PROJECT_DIR="$(find .whisky-build-src -type f -name settings.gradle -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          cp "$APK" WhiskyLTEDownloader-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhiskyLTEDownloader-debug
          path: WhiskyLTEDownloader-debug.apk
          if-no-files-found: error
          retention-days: 30
